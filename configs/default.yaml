name: default
dataset: cifar10
data_dir: ./data_cache
n_train: 10000      # reduced proxy dataset (Project 17 spec)
n_val: 5000
train: {epochs: 3, batch_size: 128, lr: 0.003}
search: {budget: 100, seeds: [0, 1, 2]}
reward: {lam_params: 0.03, lam_flops: 0.03, lam_latency: 0.0, ref_params: 1000000, ref_flops: 50000000, ref_latency_ms: 0.1}
rl: {batch: 4, lr: 0.005, entropy: 0.01, baseline_decay: 0.9, hidden: 64}
bo: {n_init: 10, n_candidates: 1000}
final: {epochs: 30}
